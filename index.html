<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jungle Jetpack</title>
<style>
:root{--bg:#6ec6ff;--gnd:#9a6a35;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2c6fa0;--gnd:#6e4a24}}
:root[data-theme="dark"]{--bg:#2c6fa0;--gnd:#6e4a24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:linear-gradient(var(--bg) 0,var(--bg) 82%,var(--gnd) 82%);display:flex;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#wrap{position:relative;width:100%;max-width:520px;height:100%;touch-action:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(function(){
'use strict';
var H=640,GAP=186,PW=62,GROUND=72,SPACE=225,FLAP=470,GRAV=1600,R=16;
var wrap=document.getElementById('wrap'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=360,sc=1,dpr=1,state='ready',score=0,best=0,pipes=[],parts=[],dist=0,t=0,flash=0,overT=0,muted=false,lastC=300,pAcc=0,sky=null,ac=null,last=0;
var g={x:110,y:270,vy:0,boost:0,tilt:0};
try{best=+localStorage.getItem('jj_best')||0}catch(e){}

function mod(a,m){return((a%m)+m)%m}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function el(x,y,rx,ry,c,r){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,r||0,0,6.2832);ctx.fill()}
function txt(s,x,y,size,col,stroke,al){
  ctx.font='900 '+size+'px "Arial Rounded MT Bold","Avenir Next",system-ui,-apple-system,sans-serif';
  ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.lineJoin='round';
  if(stroke!==null){ctx.lineWidth=size*.16;ctx.strokeStyle=stroke||'#1b2b3a';ctx.strokeText(''+s,x,y)}
  ctx.fillStyle=col||'#fff';ctx.fillText(''+s,x,y);
}
function hit(cx,cy,r,x,y,w,h){var nx=Math.max(x,Math.min(cx,x+w)),ny=Math.max(y,Math.min(cy,y+h)),dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r}

function makeSky(){
  var top='#6ec6ff';
  try{top=(getComputedStyle(document.documentElement).getPropertyValue('--bg')||'').trim()||top}catch(e){}
  sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,top);sky.addColorStop(1,'#dff6ff');
}
function resize(){
  var r=wrap.getBoundingClientRect();
  if(!r.width||!r.height)return;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  sc=r.height/H;W=r.width/sc;
  makeSky();
}

function unlock(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume()}catch(e){}}
function beep(f,d,type,v,f2){
  if(muted||!ac||ac.state!=='running')return;
  try{
    var o=ac.createOscillator(),gn=ac.createGain(),n=ac.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f2||f*1.5,n+d);
    gn.gain.setValueAtTime(v||.05,n);gn.gain.exponentialRampToValueAtTime(.0001,n+d);
    o.connect(gn);gn.connect(ac.destination);o.start(n);o.stop(n+d);
  }catch(e){}
}

function reset(){pipes=[];parts=[];score=0;g.y=H*.42;g.vy=0;g.boost=0;lastC=300;pAcc=0}
function die(){
  if(state!=='play')return;
  state='over';overT=0;flash=1;g.vy=-220;
  if(score>best){best=score;try{localStorage.setItem('jj_best',String(best))}catch(e){}}
  beep(300,.4,'sawtooth',.06,70);
}
function tap(e){
  if(e&&state!=='play'){var r=wrap.getBoundingClientRect();if(e.clientX>r.right-64&&e.clientY<r.top+64){muted=!muted;return}}
  if(state==='over'){if(overT>.6){reset();state='ready'}return}
  if(state==='ready'){reset();state='play'}
  g.vy=-FLAP;g.boost=1;beep(420,.09,'triangle',.05,760);
}

function update(dt){
  t+=dt;
  var sp=state==='play'?150+Math.min(score,30)*2:(state==='ready'?70:0);
  dist+=sp*dt;
  g.x=Math.max(80,Math.min(W*.3,150));
  g.boost=Math.max(0,g.boost-dt*4);
  if(flash>0)flash=Math.max(0,flash-dt*3.5);
  if(state==='ready'){g.y=H*.42+Math.sin(t*3)*10;g.vy=0;g.tilt=0}
  else{
    g.vy=Math.min(g.vy+GRAV*dt,720);g.y+=g.vy*dt;
    if(g.y<22){g.y=22;if(g.vy<0)g.vy=0}
    g.tilt=Math.max(-.45,Math.min(1.1,g.vy/600));
  }
  var i;
  if(state==='play'){
    for(i=0;i<pipes.length;i++)pipes[i].x-=sp*dt;
    if(!pipes.length||pipes[pipes.length-1].x<=W+60-SPACE){
      var lo=GAP/2+70,hi=H-GROUND-GAP/2-45;
      lastC=Math.max(lo,Math.min(hi,lastC+(Math.random()*2-1)*170));
      pipes.push({x:W+60,top:lastC-GAP/2,s:0});
    }
    while(pipes.length&&pipes[0].x<-PW-20)pipes.shift();
    var cy=g.y+2;
    for(i=0;i<pipes.length;i++){
      var p=pipes[i];
      if(!p.s&&p.x+PW<g.x){p.s=1;score++;beep(880,.1,'triangle',.06,1320)}
      if(hit(g.x,cy,R,p.x,-10,PW,p.top+10)||hit(g.x,cy,R,p.x-6,p.top-24,PW+12,24)||hit(g.x,cy,R,p.x,p.top+GAP,PW,H)||hit(g.x,cy,R,p.x-6,p.top+GAP,PW+12,24)){die();break}
    }
    if(state==='play'&&g.y+R+2>=H-GROUND){g.y=H-GROUND-R-2;die()}
  }
  if(state==='over'){overT+=dt;if(g.y>H-GROUND-R-2){g.y=H-GROUND-R-2;g.vy=0}}
  if(state!=='over'&&parts.length<70){
    pAcc+=dt*(16+g.boost*60);
    while(pAcc>=1){
      pAcc-=1;
      var ca=Math.cos(g.tilt),sa=Math.sin(g.tilt),lx=-24,ly=27;
      parts.push({x:g.x+lx*ca-ly*sa,y:g.y+lx*sa+ly*ca,vx:-sp*.7-Math.random()*30,vy:60+Math.random()*90,l:.5,m:.5,r:3+Math.random()*4});
    }
  }
  for(i=parts.length-1;i>=0;i--){var q=parts[i];q.l-=dt;if(q.l<=0){parts.splice(i,1);continue}q.x+=q.vx*dt;q.y+=q.vy*dt}
}

function hills(off,base,amp,fr,col){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);
  for(var x=0;x<=W+12;x+=12){var u=(x+off)*fr;ctx.lineTo(x,base-amp*(.5+.5*Math.sin(u))-amp*.35*Math.sin(u*2.3+1.3))}
  ctx.lineTo(W+12,H);ctx.closePath();ctx.fill();
}
function cloud(x,y,k){
  ctx.fillStyle='rgba(255,255,255,.85)';
  [[0,0,16],[18,-8,22],[40,0,16],[20,6,18]].forEach(function(c){ctx.beginPath();ctx.arc(x+c[0]*k,y+c[1]*k,c[2]*k,0,6.2832);ctx.fill()});
}
function bamboo(x,y,h,capTop){
  if(h<=0)return;
  ctx.fillStyle='#4cae4f';ctx.fillRect(x,y,PW,h);
  ctx.fillStyle='#7ed37f';ctx.fillRect(x+7,y,9,h);
  ctx.fillStyle='#2f8a3c';ctx.fillRect(x+PW-14,y,14,h);
  ctx.fillStyle='#2c7a38';
  for(var ny=y+20;ny<y+h-26;ny+=56)ctx.fillRect(x-2,ny,PW+4,7);
  ctx.strokeStyle='#1d5a2a';ctx.lineWidth=3;ctx.strokeRect(x,y,PW,h);
  var cy=capTop?y:y+h-24;
  ctx.fillStyle='#5cc15f';ctx.fillRect(x-6,cy,PW+12,24);
  ctx.fillStyle='#8fe091';ctx.fillRect(x-1,cy+3,9,18);
  ctx.strokeRect(x-6,cy,PW+12,24);
}
function ground(){
  var y=H-GROUND,x;
  ctx.fillStyle='#9a6a35';ctx.fillRect(-10,y,W+20,GROUND+10);
  ctx.fillStyle='#7c5226';
  for(x=-mod(dist,48);x<W+48;x+=48){ctx.fillRect(x,y+30,24,8);ctx.fillRect(x+24,y+52,24,8)}
  ctx.fillStyle='#5bc65c';ctx.fillRect(-10,y,W+20,16);
  ctx.fillStyle='#3a9a45';ctx.fillRect(-10,y+16,W+20,4);
  ctx.fillStyle='#46b04e';
  for(x=-mod(dist,24);x<W+24;x+=24){ctx.beginPath();ctx.moveTo(x,y+20);ctx.lineTo(x+12,y+20);ctx.lineTo(x+6,y+28);ctx.fill()}
}

function gorilla(){
  var fur='#5b3a24',dark='#46301d',skin='#dcaa7c';
  ctx.save();ctx.translate(g.x,g.y);ctx.rotate(g.tilt);ctx.scale(.95,.95);
  var fl=state==='over'?0:10+g.boost*30+Math.random()*7,w=Math.sin(t*14)*3;
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(-6,-6);ctx.quadraticCurveTo(-24,-14+w,-38,-8+w*1.5);ctx.lineTo(-34,1+w*1.5);ctx.quadraticCurveTo(-20,-2+w,-6,2);ctx.fill();
  ctx.save();ctx.translate(-6,0);ctx.rotate(.2-g.boost*1.2);el(0,11,6,13,dark);ctx.restore();
  [-34,-24].forEach(function(x){
    ctx.fillStyle='#ff8a1f';rr(x,-8,10,28,4);ctx.fill();
    ctx.fillStyle='#ffc27a';ctx.fillRect(x+2,-4,3,18);
    ctx.fillStyle='#8a8f98';ctx.fillRect(x,-9,10,5);ctx.fillRect(x+2,20,6,5);
    if(fl>0){
      ctx.fillStyle='#ff6a00';ctx.beginPath();ctx.moveTo(x+1,25);ctx.lineTo(x+9,25);ctx.lineTo(x+5,25+fl);ctx.fill();
      ctx.fillStyle='#ffe066';ctx.beginPath();ctx.moveTo(x+3,25);ctx.lineTo(x+7,25);ctx.lineTo(x+5,25+fl*.55);ctx.fill();
    }
  });
  el(-7,25,7,5,dark);el(8,25,7,5,dark);
  el(0,6,17,19,fur);el(4,9,11,12,skin);
  ctx.fillStyle='#ffd23f';rr(-13,-9,28,8,4);ctx.fill();
  ctx.save();ctx.translate(12,0);ctx.rotate(.5-g.boost*1.7);el(0,11,6,13,fur);el(0,23,5.5,5,skin);ctx.restore();
  el(-7,-17,4.5,5,fur);el(-7,-17,2.5,3,skin);
  el(5,-18,14,13,fur);el(10,-14,10,8.5,skin);
  el(7,-18,3.6,3.8,'#fff');el(15,-18,3.6,3.8,'#fff');
  el(8.2,-17.6,1.8,2,'#111');el(16.2,-17.6,1.8,2,'#111');
  el(13,-11.5,1.2,1,dark);el(17.5,-11.5,1.2,1,dark);
  ctx.strokeStyle=dark;ctx.lineWidth=1.8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(9,-7);ctx.quadraticCurveTo(14,-4,19,-8);ctx.stroke();
  ctx.fillStyle='#ff8a1f';ctx.fillRect(-6,-29,25,4);
  ctx.fillStyle='#8fe3ff';rr(4,-34,13,9,3.5);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#2b2b2b';ctx.stroke();
  ctx.restore();
}

function draw(){
  var s=dpr*sc,sh=flash>0?(Math.random()-.5)*10*flash:0,i;
  ctx.setTransform(s,0,0,s,sh*s,sh*s*.6);
  ctx.fillStyle=sky||'#8fd3ff';ctx.fillRect(-20,-20,W+40,H+40);
  ctx.fillStyle='rgba(255,243,170,.3)';ctx.beginPath();ctx.arc(W*.78,120,60,0,6.2832);ctx.fill();
  ctx.fillStyle='rgba(255,243,170,.95)';ctx.beginPath();ctx.arc(W*.78,120,38,0,6.2832);ctx.fill();
  for(i=0;i<4;i++)cloud(mod(i*210-dist*.12,W+260)-130,70+((i*53)%120)+(i%2)*24,.8+i*.12);
  hills(dist*.18,H-GROUND-85,60,.012,'#86d596');
  hills(dist*.4,H-GROUND-25,42,.02,'#4fae6c');
  for(i=0;i<pipes.length;i++){var p=pipes[i];bamboo(p.x,-10,p.top+10,false);bamboo(p.x,p.top+GAP,H-GROUND-p.top-GAP+20,true)}
  ground();
  for(i=0;i<parts.length;i++){var q=parts[i],k=q.l/q.m;ctx.globalAlpha=k;ctx.fillStyle=k>.55?'#ffb703':'#eeeeee';ctx.beginPath();ctx.arc(q.x,q.y,q.r*(.6+.4*k),0,6.2832);ctx.fill()}
  ctx.globalAlpha=1;
  gorilla();
  if(state==='play')txt(score,W/2,96,56);
  if(state==='ready'){
    txt('JUNGLE',W/2,138,54,'#ffd23f');txt('JETPACK',W/2,194,54,'#ff8a1f');
    ctx.globalAlpha=.65+.35*Math.sin(t*5);txt('TAP TO FLY',W/2,H*.66,28);ctx.globalAlpha=1;
    txt('Best '+best,W/2,H*.66+40,20);
  }
  if(state==='over'){
    var pw=250,ph=210,px=W/2-pw/2,py=170;
    rr(px,py,pw,ph,22);ctx.fillStyle='rgba(255,246,222,.96)';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#8a5a2b';ctx.stroke();
    txt('GAME OVER',W/2,py+42,34,'#e4572e',null);
    txt('SCORE',W/2,py+88,16,'#8a5a2b',null);txt(score,W/2,py+122,46,'#3b2a17',null);
    txt('BEST '+best,W/2,py+170,22,'#3b2a17',null);
    if(overT>.6){ctx.globalAlpha=.65+.35*Math.sin(t*6);txt('Tap to play again',W/2,py+ph+34,22);ctx.globalAlpha=1}
  }
  if(state!=='play')txt(muted?'\uD83D\uDD07':'\uD83D\uDD0A',W-30,32,26,'#fff',null);
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*.7)+')';ctx.fillRect(-20,-20,W+40,H+40)}
}

function frame(ts){
  var dt=Math.min(Math.max((ts-last)/1000,0),1/30);
  if(!last)dt=0;
  last=ts;
  update(dt);draw();
  requestAnimationFrame(frame);
}

wrap.addEventListener('pointerdown',function(e){e.preventDefault();tap(e)});
wrap.addEventListener('pointerup',unlock);
document.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();unlock();if(!e.repeat)tap()}});
document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault()});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
if(window.ResizeObserver)new ResizeObserver(resize).observe(wrap);
window.addEventListener('resize',resize);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',makeSky)}catch(e){}
try{new MutationObserver(makeSky).observe(document.documentElement,{attributes:true})}catch(e){}
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
